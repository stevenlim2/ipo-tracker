<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공모주 수익 관리</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#20242c;font:15px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 14px 70px}header,.head,.line,.sum,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:22px;margin:0}h2{font-size:16px;margin:0}.card{background:#fff;border:1px solid #e8ebef;border-radius:17px;margin:16px 0;overflow:hidden}.head{padding:18px}.hero{background:#252b35;color:#fff;padding:23px;border-radius:18px;margin-top:20px}.hero small{color:#b9c1ce}.hero strong{display:block;font-size:32px;margin:10px 0}button{border:0;background:#242a33;color:white;border-radius:11px;padding:11px 15px;font:inherit;font-weight:650;cursor:pointer}.light{background:#eef0f3;color:#444}select,input{font:inherit;border:1px solid #dce0e5;border-radius:10px;padding:11px;width:100%;background:white}header select{width:auto}.item{padding:15px 18px;border-top:1px solid #edf0f3;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:72px}.item:hover{background:#fafafa}.sub{font-size:12px;color:#87909d;margin-top:5px}.pos{color:#078b66}.neg{color:#d3484f}.dim{color:#9097a2}.right{font-weight:700;white-space:nowrap}.scroll{max-height:288px;overflow-y:auto;overscroll-behavior:contain}.empty{padding:24px;color:#8993a0;text-align:center}.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}.foot button{font-size:12px}.note{font-size:12px;color:#8c95a2;text-align:center;line-height:1.6}.overlay{display:none;position:fixed;inset:0;background:#151a2299;align-items:center;justify-content:center;padding:12px}.overlay.open{display:flex}.modal{background:#fff;width:min(100%,520px);max-height:94dvh;overflow:auto;border-radius:18px;padding:20px}.field{margin:15px 0}.field label{display:block;color:#626b77;font-size:13px;font-weight:650;margin-bottom:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.choice{padding:13px;border-bottom:1px solid #edf0f3;cursor:pointer}.choice:last-child{border:0}.suggest{max-height:184px;overflow:auto;border:1px solid #e4e7eb;border-radius:11px;margin-top:8px}.picked{background:#f4f5f7;padding:13px;border-radius:11px;margin-top:12px}.sum{border-top:1px solid #eee;padding:16px 0;font-weight:700}.sum strong{font-size:24px}.hide{display:none!important}.actions button:first-child{flex:1}.warn{font-size:12px;color:#8b6870}.link{color:#4265a0;text-decoration:underline;cursor:pointer}
</style><div class="wrap"><header><h1>공모주 수익 관리</h1><select id="year"></select></header><section class="hero"><small>올해 최종 수익</small><strong id="total">0원</strong><small id="count"></small></section><section class="card"><div class="head"><h2>청약 내역</h2><button id="add">+ 등록</button></div><div id="rows"></div></section><section class="card"><div class="head"><h2>최근 공모주 · 스팩</h2></div><div class="sub" style="padding:0 18px 12px">기본 목록 4개 높이 · 아래로 스크롤해 더 보기</div><div id="recent" class="scroll"></div></section><div class="foot"><button class="light" id="backup">백업 저장</button><button class="light" id="restore">백업 불러오기</button><button class="light" id="csv">CSV 내보내기</button><input type="file" id="file" accept=".json" hidden></div><p class="note">개인 기록은 이 브라우저에만 저장됩니다. 다른 기기와 자동 동기화되지 않습니다.<br>신규 종목 자동 연동은 아직 준비 중입니다.</p></div><div class="overlay" id="overlay"><div class="modal"><div class="head" style="padding:0"><h2 id="title">청약 등록</h2><button class="light" id="close">✕</button></div><div id="searchWrap" class="field"><label>종목 검색</label><input id="search" placeholder="과거 종목·실권주도 검색" autocomplete="off"><div id="suggest" class="suggest"></div><p class="note" id="manualHint"></p></div><div id="picked" class="picked hide"></div><div class="field hide" id="brokerWrap"><label>증권사 선택</label><select id="broker"></select></div><div class="grid"><div class="field"><label>증거금</label><input id="deposit" inputmode="numeric" placeholder="0"></div><div class="field"><label>환불금</label><input id="refund" inputmode="numeric" placeholder="미입력"></div><div class="field"><label>매도금</label><input id="sale" inputmode="numeric" placeholder="미입력"></div><div class="field"><label>지출비용</label><input id="expense" inputmode="numeric" placeholder="0"></div></div><div class="sum"><span>최종 수익</span><strong id="profit">—</strong></div><p class="warn">미배정은 매도금 0원으로 입력하세요. 비워두면 미정산으로 남습니다.</p><div class="actions"><button id="save">저장</button><button class="light hide" id="delete">삭제</button></div></div></div><script>
const KEY='ipo-tracker-personal-v1', $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])), n=v=>Number(String(v??'').replace(/,/g,''))||0, money=v=>Math.round(v).toLocaleString('ko-KR')+'원';
let db;try{db=JSON.parse(localStorage.getItem(KEY))||{ipos:[],records:[]}}catch{db={ipos:[],records:[]}};let selected=null,editing=null,year=String(new Date().getFullYear());
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}function ipo(id){return db.ipos.find(i=>i.id===id)}function brokers(i){return Array.isArray(i?.brokers)?i.brokers:String(i?.brokers||'').split(/[,/·|;]/).map(s=>s.trim()).filter(Boolean)}function kind(i){return i.type||(/스팩|SPAC/i.test(i.name)?'스팩':/실권|유상증자/.test(i.name)?'실권주':'일반공모주')}function yr(i){return (i?.listingDate||i?.subscriptionEnd||'').slice(0,4)}function done(r){return r.sale!==''&&r.sale!=null}function profit(r){return n(r.refund)-n(r.deposit)+n(r.sale)-n(r.expense)}function order(a,b){let t=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'}),x=a.subscriptionEnd||'9999',y=b.subscriptionEnd||'9999';return (x>=t?0:1)-(y>=t?0:1)||(x>=t?x.localeCompare(y):y.localeCompare(x))}
function render(){let years=[...new Set([String(new Date().getFullYear()),...db.ipos.map(yr)].filter(Boolean))].sort((a,b)=>b.localeCompare(a));if(!years.includes(year))year=years[0];$('year').innerHTML=years.map(y=>'<option>'+y+'</option>').join('');$('year').value=year;let rs=db.records.filter(r=>yr(ipo(r.ipoId))===year).sort((a,b)=>(ipo(b.ipoId)?.listingDate||'').localeCompare(ipo(a.ipoId)?.listingDate||''));let complete=rs.filter(done),total=complete.reduce((s,r)=>s+profit(r),0);$('total').textContent=(total>0?'+':'')+money(total);$('count').textContent=rs.length+'건 등록 · '+complete.length+'건 정산 완료';$('rows').innerHTML=rs.length?rs.map(r=>{let i=ipo(r.ipoId)||{};return '<div class="item" data-id="'+esc(r.id)+'"><div><b>'+esc(i.name)+'</b><div class="sub">'+esc(r.broker)+' · 상장 '+esc(i.listingDate||'미정')+'</div></div><span class="right '+(done(r)?profit(r)>=0?'pos':'neg':'dim')+'">'+(done(r)?(profit(r)>0?'+':'')+money(profit(r)):'미정산')+'</span></div>'}).join(''):'<div class="empty">등록된 청약이 없습니다. 백업을 불러오거나 + 등록을 눌러주세요.</div>';$('rows').querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>open(e.dataset.id));let items=db.ipos.filter(i=>kind(i)!=='실권주').sort(order);$('recent').innerHTML=items.length?items.map(i=>'<div class="item" data-ipo="'+esc(i.id)+'"><div><b>'+esc(i.name)+'</b><div class="sub">청약 마감 '+esc(i.subscriptionEnd||'미정')+'</div></div><span class="dim">＋</span></div>').join(''):'<div class="empty">일정 데이터가 없습니다. 과거 내역을 가져오면 목록에 표시됩니다.</div>';$('recent').querySelectorAll('[data-ipo]').forEach(e=>e.onclick=()=>{open();pick(ipo(e.dataset.ipo))})}
function pick(i){selected=i;$('searchWrap').classList.add('hide');$('picked').classList.remove('hide');$('picked').innerHTML='<b>'+esc(i.name)+'</b><div class="sub">청약 마감 '+esc(i.subscriptionEnd||'미정')+' · 상장 '+esc(i.listingDate||'미정')+'</div><div class="link sub" id="repick">다른 종목 선택</div>';$('repick').onclick=()=>{selected=null;$('searchWrap').classList.remove('hide');$('picked').classList.add('hide');suggest()};let bs=brokers(i);$('brokerWrap').classList.toggle('hide',bs.length<=1);$('broker').innerHTML=bs.map(b=>'<option>'+esc(b)+'</option>').join('')}
function suggest(){let q=$('search').value.trim().toLowerCase(),arr=db.ipos.filter(i=>q?i.name.toLowerCase().includes(q):kind(i)!=='실권주').sort(q?(a,b)=>(b.subscriptionEnd||'').localeCompare(a.subscriptionEnd||''):order);$('suggest').innerHTML=arr.map(i=>'<div class="choice" data-ipo="'+esc(i.id)+'"><b>'+esc(i.name)+'</b><span class="sub" style="float:right">마감 '+esc(i.subscriptionEnd||'미정')+'</span></div>').join('')||'<div class="empty">검색 결과 없음</div>';$('suggest').querySelectorAll('[data-ipo]').forEach(e=>e.onclick=()=>pick(ipo(e.dataset.ipo)));$('manualHint').innerHTML=q&&!arr.length?'<span class="link" id="manual">검색에 없는 종목 직접 등록</span>':'';if($('manual'))$('manual').onclick=()=>manual(q)}
function manual(q){let name=prompt('종목명',q);if(!name)return;let subscriptionEnd=prompt('청약 마감일 YYYY-MM-DD','')||'',listingDate=prompt('상장일 YYYY-MM-DD','')||'',bs=prompt('증권사 (여러 곳은 쉼표로 구분)','')||'';if((subscriptionEnd&&!/^\d{4}-\d{2}-\d{2}$/.test(subscriptionEnd))||(listingDate&&!/^\d{4}-\d{2}-\d{2}$/.test(listingDate)))return alert('날짜 형식을 확인해 주세요.');let i={id:'manual-'+Date.now(),name,subscriptionEnd,listingDate,brokers:bs,type:/스팩/i.test(name)?'스팩':'일반공모주'};db.ipos.push(i);saveDB();pick(i)}
function calc(){let r={deposit:$('deposit').value,refund:$('refund').value,sale:$('sale').value,expense:$('expense').value};$('profit').textContent=done(r)?(profit(r)>0?'+':'')+money(profit(r)):'—'}
function open(id){editing=id||null;selected=null;let r=db.records.find(x=>x.id===id);$('title').textContent=r?'청약 내역 수정':'청약 등록';$('searchWrap').classList.remove('hide');$('picked').classList.add('hide');$('search').value='';['deposit','refund','sale','expense'].forEach(k=>$(k).value=r?.[k]==null?'':String(r[k]).replace(/\B(?=(\d{3})+(?!\d))/g,','));$('delete').classList.toggle('hide',!r);if(r){let i=ipo(r.ipoId);if(i){pick(i);if(!brokers(i).includes(r.broker)&&r.broker)$('broker').innerHTML+='<option>'+esc(r.broker)+'</option>';$('broker').value=r.broker}}else suggest();calc();$('overlay').classList.add('open')}
$('add').onclick=()=>open();$('close').onclick=()=> $('overlay').classList.remove('open');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};$('search').oninput=suggest;$('year').onchange=e=>{year=e.target.value;render()};['deposit','refund','sale','expense'].forEach(k=>{let e=$(k);e.oninput=calc;e.onblur=()=>{let raw=e.value.replace(/[^\d]/g,'');e.value=raw?Number(raw).toLocaleString('ko-KR'):'';calc()};e.onfocus=()=>e.value=e.value.replace(/,/g,'')});
$('save').onclick=()=>{if(!selected)return alert('종목을 선택해 주세요.');let bs=brokers(selected),r={id:editing||'r-'+Date.now(),ipoId:selected.id,broker:bs.length<=1?(bs[0]||''):$('broker').value,deposit:$('deposit').value.replace(/,/g,''),refund:$('refund').value.replace(/,/g,''),sale:$('sale').value.replace(/,/g,''),expense:$('expense').value.replace(/,/g,'')};if(editing)db.records=db.records.map(x=>x.id===editing?r:x);else db.records.push(r);saveDB();$('overlay').classList.remove('open');render()};$('delete').onclick=()=>{if(editing&&confirm('이 청약 기록을 삭제할까요?')){db.records=db.records.filter(r=>r.id!==editing);saveDB();$('overlay').classList.remove('open');render()}};
function download(name,body,type){let u=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('backup').onclick=()=>download('ipo-backup.json',JSON.stringify(db,null,2),'application/json');$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.ipos)||!Array.isArray(d.records))throw Error();if(confirm('현재 기록을 불러온 데이터로 교체할까요?')){db=d;saveDB();render()}}catch{alert('올바른 백업 JSON 파일이 아닙니다.')}e.target.value=''};$('csv').onclick=()=>{let rows=[['종목명','증권사','상장일','증거금','환불금','매도금','지출비용','최종수익'],...db.records.map(r=>{let i=ipo(r.ipoId)||{};return[i.name,r.broker,i.listingDate,r.deposit,r.refund,r.sale,r.expense,done(r)?profit(r):'']})];download('ipo-records.csv','\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};render();
</script></html>
