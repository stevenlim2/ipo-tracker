function accountList(){return Array.isArray(db.accounts)?db.accounts:[];}
function renderAccounts(){const rows=accountList();let html='';for(const type of ['증권사','은행']){const subset=rows.filter(a=>(a.type||'증권사')===type);if(!subset.length)continue;html+='<div class="account-group">'+type+'</div><div class="account-sort-group" data-type="'+type+'">'+subset.map(a=>'<div class="account-line" data-account-id="'+esc(a.id)+'"><button type="button" class="account-tap account-simple" data-copy="'+esc(a.id)+'"><strong>'+esc(a.bank)+'</strong><span>'+esc(String(a.number).replace(/-/g,''))+'</span></button><button type="button" class="account-drag-handle" aria-label="'+esc(a.bank)+' 순서 변경" title="드래그해서 순서 변경">☰</button></div>').join('')+'</div>';}$('accountRows').innerHTML=html||'<div class="empty">저장된 계좌가 없어요.</div>';for(const e of $('accountRows').querySelectorAll('[data-copy]'))e.onclick=()=>copyAccount(e.dataset.copy);for(const e of $('accountRows').querySelectorAll('.account-drag-handle'))setupAccountHandle(e);}
function setupAccountHandle(handle){
  handle.addEventListener('pointerdown',e=>{

      const before=candidates.find(el=>ev.clientY<el.getBoundingClientRect().top+el.getBoundingClientRect().height/2);
      const next=before||null;
      if(row.nextElementSibling!==next){
        group.insertBefore(row,next);
        moved=true;
      }
    };

      document.removeEventListener('pointercancel',finish);

      }
    };
    document.addEventListener('pointermove',move,{passive:false});
    document.addEventListener('pointerup',finish);
    document.addEventListener('pointercancel',finish);
  });

function datesort(a,b){let today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'}),ad=a.subscriptionEnd||'9999',bd=b.subscriptionEnd||'9999';return (ad>=today?0:1)-(bd>=today?0:1)||(ad>=today?ad.localeCompare(bd):bd.localeCompare(ad))}

function pick(i){picked=i;$('searchWrap').classList.add('hide');$('picked').classList.remove('hide');$('picked').innerHTML=`<div class="picked-label">종목명</div><b>${esc(i.name)}</b><div class="meta">청약일 ${esc(i.subscriptionEnd||'미정')} · 상장 ${esc(i.listingDate||'미정')}${listingCountdown(i.listingDate)}</div><div class="small link" id="repick" style="margin-top:8px">다른 종목 선택</div>`;$('repick').onclick=()=>{picked=null;$('searchWrap').classList.remove('hide');$('picked').classList.add('hide');suggest()};let bs=brokers(i);$('brokerWrap').classList.toggle('hide',bs.length===0);$('broker').innerHTML=bs.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');$('broker').disabled=bs.length===1}
