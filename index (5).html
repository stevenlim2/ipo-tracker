권사 선택</label><select id="broker"></select></div><div class="grid"><div class="field"><label>증거금</label><input type="text" inputmode="numeric" id="deposit" placeholder="0"></div><div class="field"><label>환불금</label><input type="text" inputmode="numeric" id="refund" placeholder="미입력"></div><div class="field"><label>매도금</label><input type="text" inputmode="numeric" id="sale" placeholder="미입력"></div><div class="field"><label>지출비용</label><input type="text" inputmode="numeric" id="expense" placeholder="0"></div></div><div class="calc"><span>최종 수익</span><strong id="profit">—</strong></div><p class="small">미배정이면 매도금 0원을 입력해 주세요. 비워두면 미정산으로 남아요.</p><div class="actions"><button id="save">저장</button><button id="delete" class="danger hide">삭제</button></div></div></div><script>

function years(){let ys=[...new Set([...db.ipos.map(yr),String(new Date().getFullYear())].filter(Boolean))].sort((a,b)=>b.localeCompare(a));$('year').innerHTML=ys.map(y=>`<option value="${esc(y)}">${esc(y)}년</option>`).join('');if(!ys.includes(yearVal))yearVal=ys[0];$('year').value=yearVal}
function render(){years();let list=db.records.filter(r=>yr(get(r.ipoId))===yearVal).sort((a,b)=>(get(b.ipoId)?.listingDate||'').localeCompare(get(a.ipoId)?.listingDate||''));let complete=list.filter(done);let sum=complete.reduce((a,r)=>a+profit(r),0);$('total').textContent=(sum>0?'+':'')+fmt(sum);$('count').textContent=`${list.length}건 등록 · ${complete.length}건 정산 완료`;$('rows').innerHTML=list.length?list.map(r=>{let i=get(r.ipoId)||{};return `<div class="item" data-id="${esc(r.id)}"><div><div class="name">${esc(i.name||'알 수 없는 종목')}</div><div class="meta">${esc(r.broker||brokers(i)[0]||'')} · 상장 ${esc(i.listingDate||'미정')}</div></div><div class="right ${done(r)?profit(r)>=0?'pos':'neg':'dim'}">${done(r)?(profit(r)>0?'+':'')+fmt(profit(r)):'미정산'}</div></div>`}).join(''):'<div class="empty">아직 등록한 청약이 없어요.</div>';$('rows').querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>openModal(e.dataset.id));let upcoming=db.ipos.filter(i=>kind(i)!=='실권주').sort(datesort);$('recent').innerHTML=upcoming.length?upcoming.map(i=>`<div class="item" data-ipo="${esc(i.id)}"><div><div class="name">${esc(i.name)}<span class="tag">${esc(kind(i)==='스팩'?'스팩':'일반')}</span></div><div class="meta">청약일 ${esc(i.subscriptionEnd||'미정')} · ${esc(brokers(i).join(', ')||'주관사 미정')}</div></div><span class="dim">＋</span></div>`).join(''):'<div class="empty">표시할 일정이 없어요.</div>';$('recent').querySelectorAll('[data-ipo]').forEach(e=>e.onclick=()=>{openModal();pick(get(e.dataset.ipo))})}
function pick(i){picked=i;$('searchWrap').classList.add('hide');$('picked').classList.remove('hide');$('picked').innerHTML=`<b>${esc(i.name)}</b><div class="meta">청약일 ${esc(i.subscriptionEnd||'미정')} · 상장 ${esc(i.listingDate||'미정')}</div><div class="small link" id="repick" style="margin-top:8px">다른 종목 선택</div>`;$('repick').onclick=()=>{picked=null;$('searchWrap').classList.remove('hide');$('picked').classList.add('hide');suggest()};let bs=brokers(i);$('brokerWrap').classList.toggle('hide',bs.length<=1);$('broker').innerHTML=bs.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('')}
function suggest(){let q=$('search').value.trim().toLowerCase(),arr=db.ipos.filter(i=>!q?kind(i)!=='실권주':i.name.toLowerCase().includes(q));arr.sort(q?(a,b)=>(b.subscriptionEnd||'').localeCompare(a.subscriptionEnd||''):datesort);$('suggest').innerHTML=arr.map(i=>`<div class="choice" data-ipo="${esc(i.id)}"><strong>${esc(i.name)}</strong><span class="meta">청약일 ${esc(i.subscriptionEnd||'미정')}</span></div>`).join('')||'<div class="empty">검색 결과 없음</div>';$('suggest').querySelectorAll('[data-ipo]').forEach(e=>e.onclick=()=>pick(get(e.dataset.ipo)));$('missing').innerHTML=q&&!arr.length?'온라인 일정에 없는 종목이라면 <span class="link" id="manual">직접 등록</span>할 수 있어요.':'';let m=$('manual');if(m)m.onclick=()=>manual(q)}
function manual(q){let name=prompt('종목명',q||'');if(!name)return;let date=prompt('청약 마감일 (YYYY-MM-DD)','');if(date&&!/^\d{4}-\d{2}-\d{2}$/.test(date))return alert('날짜 형식을 확인해주세요.');let listing=prompt('상장일 (YYYY-MM-DD, 모르면 빈칸)','')||'';if(listing&&!/^\d{4}-\d{2}-\d{2}$/.test(listing))return alert('날짜 형식을 확인해주세요.');let broker=prompt('주관 증권사 (여러 곳은 쉼표로 구분)','')||'';let type=confirm('실권주인가요? 확인=실권주, 취소=일반 공모주');let i={id:'manual-'+Date.now(),name,subscriptionEnd:date,listingDate:listing,brokers:broker,type:type?'실권주':/스팩/i.test(name)?'스팩':'일반공모주'};db.ipos.push(i);persist();pick(i)}
function calc(){let r={deposit:$('deposit').value.replace(/,/g,''),refund:$('refund').value.replace(/,/g,''),sale:$('sale').value.replace(/,/g,''),expense:$('expense').value.replace(/,/g,'')};$('profit').textContent=done(r)?(profit(r)>0?'+':'')+fmt(profit(r)):'—';$('profit').className=done(r)?profit(r)>=0?'pos':'neg':''}
function openModal(id){editing=id||null;picked=null;let r=db.records.find(x=>x.id===id);$('modalTitle').textContent=r?'청약 내역 수정':'청약 등록';$('searchWrap').classList.remove('hide');$('picked').classList.add('hide');$('search').value='';['deposit','refund','sale','expense'].forEach(k=>$(k).value=r?.[k]===undefined?'':String(r[k]).replace(/\B(?=(\d{3})+(?!\d))/g,','));$('delete').classList.toggle('hide',!r);if(r){let i=get(r.ipoId);if(i){pick(i);if(brokers(i).includes(r.broker))$('broker').value=r.broker;else if(r.broker){$('broker').innerHTML+=`<option value="${esc(r.broker)}">${esc(r.broker)}</option>`;$('broker').value=r.broker}}}else suggest();calc();$('overlay').classList.add('open')}
function close(){$('overlay').classList.remove('open')}$('add').onclick=()=>openModal();$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};$('search').oninput=suggest;['deposit','refund','sale','expense'].forEach(k=>{
  $(k).oninput=e=>{e.target.value=e.target.value.replace(/[^0-9,]/g,'');calc()};
  $(k).onblur=e=>{let raw=e.target.value.replace(/,/g,'');e.target.value=raw?Number(raw).toLocaleString('ko-KR'):'';calc()};
  $(k).onfocus=e=>{e.target.value=e.target.value.replace(/,/g,'')};
});$('year').onchange=e=>{yearVal=e.target.value;render()};$('save').onclick=()=>{if(!picked)return alert('종목을 선택해주세요.');let b=brokers(picked);let r={id:editing||'r-'+Date.now(),ipoId:picked.id,broker:b.length<=1?(b[0]||''):$('broker').value,deposit:$('deposit').value.replace(/,/g,''),refund:$('refund').value.replace(/,/g,''),sale:$('sale').value.replace(/,/g,''),expense:$('expense').value.replace(/,/g,''),created:new Date().toISOString().slice(0,10)};if(editing)db.records=db.records.map(x=>x.id===editing?r:x);else db.records.push(r);yearVal=yr(picked)||yearVal;persist();close();render()};$('delete').onclick=()=>{if(!editing||!confirm('이 기록을 삭제할까요?'))return;db.records=db.records.filter(r=>r.id!==editing);persist();close();render()};
function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('backup').onclick=()=>download('ipo-backup.json',JSON.stringify(db,null,2),'application/json');$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.ipos)||!Array.isArray(d.records))throw Error();if(confirm('현재 기록을 백업 내용으로 교체할까요?')){db=d;persist();render()}}catch{alert('백업 파일 형식이 올바르지 않습니다.')}e.target.value=''};$('csv').onclick=()=>{let rows=[['종목명','증권사','상장일','증거금','환불금','매도금','지출비용','최종수익'],...db.records.map(r=>{let i=get(r.ipoId)||{};return[i.name||'',r.broker,i.listingDate||'',r.deposit,r.refund,r.sale,r.expense,done(r)?profit(r):'']})];download('ipo-records.csv','\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};

const SUPABASE_URL='https://wykbmsalodlkelwxmlfb.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_bfMTOVthqua4R7YJFjqrcw_X4cD2bCs';
let cloud=null,cloudUser=null,cloudReady=false,cloudDirty=false,cloudBusy=false,cloudTimer=null,cloudChannel=null;

 if(!cloudReady||!cloudUser)return;

}
async function pushCloud(){
 if(!cloudReady||!cloudUser||!cloudDirty||cloudBusy)return;

 const snapshot=JSON.parse(JSON.stringify(db));
 cloudStatus('클라우드 저장 중…');
 try{
  const {error}=await cloud.from('ipo_data').upsert(
   {user_id:cloudUser.id,data:snapshot,updated_at:new Date().toISOString()},
   {onConflict:'user_id'});

 }catch(e){cloudDirty=true;cloudStatus('저장 실패 — 백업을 보관하세요');console.error(e)}

}

 if(!cloudReady||cloudDirty||cloudBusy)return;

 if(error||!data?.data)return;

  if(error)throw error;
  if(data?.data){
   if(!Array.isArray(data.data.ipos)||!Array.isArray(data.data.records))throw Error('클라우드 데이터 형식 오류');
   db=data.data;localStorage.setItem(KEY,JSON.stringify(db));
  }else if(db.records.length){
   if(!confirm('이 브라우저의 기존 '+db.records.length+'건을 클라우드로 최초 이전할까요?')){ $('authError').textContent='이전이 취소됐습니다.';return}

 }catch(e){$('authError').textContent='클라우드 불러오기 실패: '+e.message;console.error(e)}

$('loginPassword').onkeydown=e=>{if(e.key==='Enter')$('loginButton').click()};
$('logoutButton').onclick=async()=>{
 if(cloudDirty||cloudBusy)return alert('아직 저장 중입니다. 잠시 후 다시 시도하세요.');
 if(cloudChannel){await cloud.removeChannel(cloudChannel);cloudChannel=null}
 await cloud.auth.signOut();cloudReady=false;cloudUser=null;
 $('privateApp').classList.add('locked');$('authPanel').classList.remove('hide');
 $('loginPassword').value='';$('authError').textContent='';
};
(async()=>{
 try{
  if(!window.supabase?.createClient)throw Error('연결 라이브러리를 불러오지 못했습니다.');
  cloud=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const {data,error}=await cloud.auth.getSession();
  if(error)throw error;
  if(data.session?.user)await activateCloud(data.session.user);
 }catch(e){$('authError').textContent='연결 오류: '+e.message}
})();
</script></body></html>
