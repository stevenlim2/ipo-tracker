name: Update IPO calendar
on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch IPO calendar
        run: python scripts/update_ipo_feed.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipo-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public IPO calendar"
            git push
          fi
